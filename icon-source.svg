<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2a1250"/>
      <stop offset="55%" stop-color="#0c0420"/>
      <stop offset="100%" stop-color="#05010c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fe3ff"/>
      <stop offset="60%" stop-color="#b980ff"/>
      <stop offset="100%" stop-color="#ff3fc9"/>
    </linearGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#4fe3ff"/>
      <stop offset="100%" stop-color="#1b7fae" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- faint starfield -->
  <g fill="#9fd4ff" opacity="0.55">
    <circle cx="86" cy="120" r="2.6"/>
    <circle cx="430" cy="96" r="2"/>
    <circle cx="70" cy="400" r="2.2"/>
    <circle cx="452" cy="360" r="2.6"/>
    <circle cx="150" cy="440" r="1.8"/>
    <circle cx="380" cy="440" r="2"/>
  </g>

  <!-- orbit ring -->
  <g filter="url(#glow)">
    <ellipse cx="256" cy="270" rx="168" ry="92" fill="none" stroke="url(#ring)" stroke-width="12" transform="rotate(-18 256 270)"/>
  </g>

  <!-- central glowing orb -->
  <circle cx="256" cy="246" r="72" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="256" cy="246" r="58" fill="#0d1424"/>
  <circle cx="256" cy="246" r="54" fill="none" stroke="#4fe3ff" stroke-width="7" filter="url(#glow)"/>

  <!-- comet dot riding the ring -->
  <circle cx="412" cy="232" r="13" fill="#ff3fc9" filter="url(#glow)"/>
</svg>
